<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src//assets/images/logoLight.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudip Mandal — Full Stack Developer</title>
    <meta name="description" content="Sudip Mandal — Full Stack Developer specializing in the MERN stack, AI-powered products, Playwright test automation, Docker, and cloud deployments. Browse projects, experience, and more." />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph / Social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sudip Mandal | Full Stack Developer" />
    <meta property="og:description" content="Full Stack Developer specializing in the MERN stack, AI-driven products, and production-grade web applications." />
    <meta property="og:image" content="https://sudipoffice.github.io/portfolioImages/images/Portfolio/sudipBW.webp" />
    <meta property="og:url" content="https://sudipoffice.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sudip Mandal | Full Stack Developer" />
    <meta name="twitter:description" content="Full Stack Developer specializing in the MERN stack, AI-driven products, and production-grade web applications." />
    <meta name="twitter:image" content="https://sudipoffice.github.io/portfolioImages/images/Portfolio/sudipBW.webp" />

    <!-- Dark mode: prevent flash before React hydrates (defaults to dark) -->
    <script>(function(){try{var d=document.documentElement;var c=localStorage.getItem('isDarkMode');if(c!=='false')d.classList.add('dark');}catch(e){}}())</script>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://sudipoffice.github.io">
    <link rel="dns-prefetch" href="https://sudipoffice.github.io">

    <!-- Preload hero image -->
    <link rel="preload" href="https://sudipoffice.github.io/portfolioImages/images/Portfolio/sudipBW.webp" as="image" fetchpriority="high">

    <!-- Preload only fonts used above the fold -->
    <link rel="preload" href="https://sudipoffice.github.io/portfolioImages/fonts/Extenda10.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://sudipoffice.github.io/portfolioImages/fonts/Extenda20.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://sudipoffice.github.io/portfolioImages/fonts/Extenda30.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://sudipoffice.github.io/portfolioImages/fonts/Extenda50.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://sudipoffice.github.io/portfolioImages/fonts/Extenda90.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Dark-mode-aware meta: spatial themes -->
    <meta name="color-scheme" content="dark light" />
  </head>
